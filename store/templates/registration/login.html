{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | E-Mercato</title>
</head>
<body style="font-family: sans-serif; padding: 50px; text-align: center; max-width: 400px; margin: auto;">
    <img src="{% static 'store/images/logo_e-mercato.png' %}" alt="Logo E-Mercato" style="height: 200px; margin-bottom: 20px;">
    
    <h2 style="color: #2c3e50;">Bienvenido de nuevo</h2>
    <p style="color: #7f8c8d; margin-bottom: 30px;">Inicia sesión para gestionar tus compras.</p>

    <!-- El formulario mágico de Django -->
    <form method="POST" action="{% url 'login' %}" style="text-align: left; background: #f8f9fa; padding: 20px; border-radius: 8px;">
        {% csrf_token %}
        
        <!-- Django renderiza los campos de usuario y contraseña automáticamente -->
        {{ form.as_p }}
        
        <button type="submit" style="width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;">
            Entrar
        </button>
    </form>
</body>
</html>
