{% extends "store/base.html" %}
{% load static %}

{% block title %}Iniciar Sesión | E-Mercato{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[75vh] py-10 px-4 sm:px-6">

    <!-- Tarjeta de Login -->
    <div class="bg-white rounded-3xl border border-gray-100 shadow-xl p-8 sm:p-12 max-w-md w-full relative overflow-hidden">

        <!-- Detalle decorativo superior con gradiente -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-petroleo to-coral"></div>

        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="{% url 'welcome' %}">
                <img src="{% static 'store/images/logo_e-mercato.png' %}" alt="Logo E-Mercato" class="h-20 mx-auto transition-transform duration-300 hover:scale-105">
            </a>
        </div>

        <div class="text-center mb-8">
            <h2 class="text-2xl sm:text-3xl font-heading font-bold text-gray-900 tracking-tight mb-2">Bienvenido de nuevo</h2>
            <p class="text-gray-500 font-medium text-sm">Inicia sesión para gestionar tus compras.</p>
        </div>

        <!-- Formulario con estilizado automático de Django vía Tailwind -->
        <form method="POST" action="{% url 'login' %}" class="[&_p]:mb-5 [&_label]:block [&_label]:text-sm [&_label]:font-bold [&_label]:text-gray-700 [&_label]:mb-1.5 [&_input]:w-full [&_input]:rounded-xl [&_input]:border [&_input]:border-gray-200 [&_input]:px-4 [&_input]:py-3 [&_input]:text-gray-800 [&_input]:bg-gray-50 focus:[&_input]:bg-white focus:[&_input]:ring-2 focus:[&_input]:ring-petroleo focus:[&_input]:border-transparent [&_input]:transition-all [&_input]:duration-200 [&_ul.errorlist]:text-red-500 [&_ul.errorlist]:text-xs [&_ul.errorlist]:mt-1 [&_ul.errorlist]:font-semibold [&_span.helptext]:text-xs [&_span.helptext]:text-gray-500 [&_span.helptext]:mt-1 [&_span.helptext]:block">
            {% csrf_token %}

            {{ form.as_p }}

            <!-- Botón de Entrar (Usamos Azul Petróleo para diferenciarlo del Registro) -->
            <button type="submit" class="w-full mt-6 bg-petroleo hover:bg-teal-800 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                Entrar
            </button>
        </form>

        <!-- Enlace a Registro (Mejora de UX) -->
        <div class="mt-8 text-center border-t border-gray-100 pt-6">
            <p class="text-sm text-gray-500 font-medium">
                ¿No tienes una cuenta?
                <a href="{% url 'register' %}" class="text-coral font-bold hover:text-orange-600 transition-colors ml-1">Regístrate aquí</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
