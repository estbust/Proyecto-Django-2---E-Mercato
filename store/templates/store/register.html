{% extends "store/base.html" %}
{% load static %}

{% block title %}Crear Cuenta | E-Mercato{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[75vh] py-10 px-4 sm:px-6">

    <!-- Tarjeta de Registro -->
    <div class="bg-white rounded-3xl border border-gray-100 shadow-xl p-8 sm:p-12 max-w-md w-full relative overflow-hidden">

        <!-- Detalle decorativo superior con gradiente -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-petroleo to-coral"></div>

        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="{% url 'welcome' %}">
                <img src="{% static 'store/images/logo_e-mercato.png' %}" alt="Logo E-Mercato" class="h-20 mx-auto transition-transform duration-300 hover:scale-105">
            </a>
        </div>

        <div class="text-center mb-8">
            <h2 class="text-2xl sm:text-3xl font-heading font-bold text-gray-900 tracking-tight mb-2">¡Crea una cuenta con nosotros!</h2>
            <p class="text-gray-500 font-medium text-sm">Crea tu cuenta para empezar a comprar.</p>
        </div>

        <!-- Formulario con estilizado automático de Django vía Tailwind -->
        <form method="POST" action="{% url 'register' %}" class="[&_p]:mb-5 [&_label]:block [&_label]:text-sm [&_label]:font-bold [&_label]:text-gray-700 [&_label]:mb-1.5 [&_input]:w-full [&_input]:rounded-xl [&_input]:border [&_input]:border-gray-200 [&_input]:px-4 [&_input]:py-3 [&_input]:text-gray-800 [&_input]:bg-gray-50 focus:[&_input]:bg-white focus:[&_input]:ring-2 focus:[&_input]:ring-petroleo focus:[&_input]:border-transparent [&_input]:transition-all [&_input]:duration-200 [&_ul.errorlist]:text-red-500 [&_ul.errorlist]:text-xs [&_ul.errorlist]:mt-1 [&_ul.errorlist]:font-semibold [&_span.helptext]:text-xs [&_span.helptext]:text-gray-500 [&_span.helptext]:mt-1 [&_span.helptext]:block">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="w-full mt-6 bg-coral hover:bg-orange-600 active:bg-orange-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                </svg>
                Crear Cuenta
            </button>
        </form>

        <!-- Enlace a Login -->
        <div class="mt-8 text-center border-t border-gray-100 pt-6">
            <p class="text-sm text-gray-500 font-medium">
                ¿Ya tienes una cuenta?
                <a href="{% url 'login' %}" class="text-petroleo font-bold hover:text-coral transition-colors ml-1">Inicia sesión aquí</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
