{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta | E-Mercato</title>
</head>
<body style="font-family: sans-serif; padding: 50px; text-align: center; max-width: 400px; margin: auto;">
    <img src="{% static 'store/images/logo_e-mercato.png' %}" alt="Logo E-Mercato" style="height: 200px; margin-bottom: 20px;">
    <h2 style="color: #2c3e50;">Crea una cuenta con nosotros!</h2>
    <p style="color: #7f8c8d; margin-bottom: 30px;">Crea tu cuenta para empezar a comprar.</p>

    <form method="POST" action="{% url 'register' %}" style="text-align: left; background: #f8f9fa; padding: 20px; border-radius: 8px;">
        <!-- El escudo de seguridad obligatorio de Django para formularios POST -->
        {% csrf_token %}
        
        <!-- Aquí Django renderiza automáticamente los campos (Usuario, Contraseña, Confirmar Contraseña) -->
        {{ form.as_p }}
        
        <button type="submit" style="width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;">
            Crear Cuenta
        </button>
    </form>

    <div style="margin-top: 20px;">
        <a href="{% url 'login' %}" style="text-decoration: none; color: #3498db; font-size: 14px;">¿Ya tienes una cuenta? Inicia sesión aquí</a>
    </div>
</body>
</html>
